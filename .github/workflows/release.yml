name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag uses semantic version format
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Ensure tag points to main history
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

  windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GUI self-test
        run: python gui/converter_gui.py --self-test
      - name: Install PyInstaller
        timeout-minutes: 5
        run: >-
          python -m pip install
          --disable-pip-version-check
          --timeout 60
          --retries 2
          --only-binary=:all:
          pyinstaller==6.20.0
      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --paths vendor `
            --hidden-import vgamepad `
            --hidden-import vgamepad.win.vigem_client `
            --hidden-import vgamepad.win.vigem_commons `
            --hidden-import vgamepad.win.virtual_gamepad `
            --add-binary "vendor\vgamepad\win\vigem\client\x64\ViGEmClient.dll;vgamepad\win\vigem\client\x64" `
            --add-binary "vendor\vgamepad\win\vigem\client\x86\ViGEmClient.dll;vgamepad\win\vigem\client\x86" `
            --name KeyMouse2Pad `
            gui\converter_gui.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyMouse2Pad-${{ needs.validate-tag.outputs.version }}-windows
          path: dist/KeyMouse2Pad.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KeyMouse2Pad ${{ needs.validate-tag.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.validate-tag.outputs.version, '-') }}
          files: dist/KeyMouse2Pad.exe
