name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-gui:
    name: Python GUI smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GUI self-test
        run: python gui/converter_gui.py --self-test

  cpp-mapping:
    name: C++ mapping tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Run mapping tests
        run: make test
